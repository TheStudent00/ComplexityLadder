name: complexity_ladder
description: One orthogonal grid puzzle whose eight physics switches move it across L, NL, P, NP, PSPACE, EXPTIME, NEXPTIME, EXPSPACE, and 2EXPTIME.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  ladder_core:
    path: ../ladder_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
